  const allTasks = vals(S.tasks).filter(t => S.releases[t.release]?.artist === p.id && (teamMode || t.owner === 'A' || t.owner === 'T'));
  const openT = r ? tasksOf(r.id).filter(t => !t.done && (!isPreview() || t.owner === 'A' || helpersOf(t).includes('A'))) : [];
  const nexts = openT.filter(t => t.phase === openT[0]?.phase), next = nexts[0] || null;
  const week = allTasks.filter(t => S.releases[t.release] === r).slice(0,5);
  const yr = contractYear(p);
  const team = !isPreview();
  return `${cloudSvg}${previewBanner()}
    ${photoOf(p) ? `<div class="starthero"><img class="aheadimg" src="${esc(photoOf(p))}" alt=""><span class="aheadshade"></span><button class="heroprof" data-go="profile" data-id="${esc(p.id)}" aria-label="Profil öffnen"></button>` : '<div>'}<div class="topbar">${team ? `<button class="back" data-act="home">${icon.back}Artists</button>` : `<span class="brand"><span><b>CLOUDS<svg class="bolt" width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><path d="M8 0L0 10h5l-2 8 9-11H7l1-7z" fill="#FFCC00"/></svg>RECORDS</b><i>Where Creativity Becomes Reality</i></span></span>`}<span class="row" style="gap:8px">${team ? `<button class="chip" style="background:var(--raise);color:var(--ink)" data-act="preview" data-id="${esc(p.id)}">ARTIST-SICHT</button><button class="chip" style="background:var(--raise);color:var(--ink)" data-act="editperson" data-id="${esc(p.id)}">VERTRAG</button>` : `<span class="yearpill">${yearLabel(p)}</span>`}</span></div>
    <div class="pad" style="padding-top:14px;position:relative" ${photoOf(p) ? 'data-heroin' : ''}><div class="row" style="gap:14px;align-items:center"><h1 class="h-giant" style="font-size:44px;min-width:0">${team ? esc(p.name) : `Hey ${esc(p.name)}.`}</h1></div>${team ? `<div class="small" style="margin-top:6px">${yearLabel(p)}${dropboxFolder(p, ' · DROPBOX-ORDNER →', 'small', 'font-weight:600;color:var(--sun);text-decoration:none')}</div>` : ''}
      <div class="boxes" style="margin-top:16px" aria-label="Vertrag: ${esc(countLine(p))}">${boxesHTML(p)}</div><div class="small" style="margin-top:8px">${countLine(p)}</div></div></div>
    <div class="row" style="gap:8px;margin:16px 16px 0;flex-wrap:wrap">
      <button class="pill" data-go="profile" data-id="${esc(p.id)}">👤 Profil · ${profileScore(p.id)} %</button>
      <button class="pill" data-act="calfor" data-id="${esc(p.id)}">📅 Kalender</button>${!team ? `<button class="pill" data-go="search">🔍 Suche</button><button class="pill" data-go="week">📊 Woche</button>${lockedArtist === p.id ? `<button class="pill sun" data-act="addnote">${icon.plus} Nachricht ans Team</button><button class="pill" data-act="tech">🛠 Technik</button>` : ''}` : ''}</div>
    ${team ? (() => { const n = notesFor(p.id).filter(x => !(x.doneBy||[]).includes(p.id)).length, o = vals(S.tasks).filter(t => !t.done && t.owner === 'A' && S.releases[t.release]?.artist === p.id).length;
      return `<button class="vrow" data-go="apin" data-id="${esc(p.id)}" style="margin:18px 16px 0;width:calc(100% - 32px);cursor:pointer;text-align:left;font:inherit"><span class="play">${icon.roster}</span><span class="stack" style="flex:1;gap:2px"><b>Pinnwand von ${esc(p.name)}</b><span class="small">${n} ${n === 1 ? 'NACHRICHT' : 'NACHRICHTEN'} · ${o} ${o === 1 ? 'AUFGABE' : 'AUFGABEN'} OFFEN</span></span>${icon.chev}</button>`; })() : ''}
    ${!team ? upcomingBlock(p.id) + vArtistPin({id:p.id}, true) : ''}

    ${(() => { const st = rcState(r), n = st.filter(x => x.ok).length; return `<div class="nextcard">
      <div class="between"><span class="mono" style="font-size:11px;font-weight:700"><span class="sw" style="background:${TYPE[r.type].c};margin-right:6px"></span>${esc(r.code)} · ${esc(relTitle(r).toUpperCase())}</span>${r.date?`<span class="mono" style="font-size:11px;font-weight:700">${fmt(r.date)}</span>`:''}</div>
      ${nexts.length > 1 ? `<div class="stack" style="gap:10px"><span class="mono" style="font-size:11px;font-weight:700">LÄUFT PARALLEL · ${esc(next.phase)} · ${nexts.length} PUNKTE</span>${nexts.map(t => `<button data-act="taskview" data-id="${esc(t.id)}" class="stack" style="gap:2px;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer"><span style="font-family:var(--head);font-size:22px;line-height:1.05;text-transform:uppercase">${esc(t.title)}</span><span class="mono" style="font-size:11px;font-weight:700;opacity:.75">${taskDue(t) ? (taskDue(t) < todayIso() ? 'ÜBERFÄLLIG · ' : 'BIS ') + fmt(taskDue(t)) : 'OHNE FRIST'}${team ? ' · ' + esc(ownerName(t.owner).toUpperCase()) : ''}</span></button>`).join('')}</div>`
        : `<span style="font-family:var(--head);font-size:30px;line-height:1.05;text-transform:uppercase">${esc(next?.title || (team ? 'Noch kein Fahrplan' : 'Fahrplan folgt vom Team'))}</span>${next && taskDue(next) ? `<span class="mono" style="font-size:11px;font-weight:700;opacity:.75">${taskDue(next) < todayIso() ? 'ÜBERFÄLLIG · ' : 'BIS '}${fmt(taskDue(next))}</span>` : ''}`}

async function sessionPlan(pid){
  /* 6 Termine: jeweils erster Mittwoch der kommenden Monate, 18 Uhr – im Termin änderbar */
  const d = today(); let made = 0;
  for(let i = 0; made < 6 && i < 8; i++){
    const m = new Date(d.getFullYear(), d.getMonth() + i, 1);
    while(m.getDay() !== 3) m.setDate(m.getDate() + 1);
    if(m < d) continue;
    const iso = new Date(m.getTime() - m.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    await put('sessions', uid('ls'), {producer:pid, date:iso, time:'18:00', note:'', done:false}, false); made++;
  }
  toast('6 Monatstermine angelegt · jeweils erster Mittwoch, 18 Uhr');
}

let FOLD = new Set(); try{ FOLD = new Set(JSON.parse(localStorage.getItem('cr_fold') || '[]')); }catch(_){}
function foldSections(v){
  const r = cur().r; if(!['pin','apin','artiststart','release','video'].includes(r)) return;
  v.querySelectorAll('.between').forEach(hd => {
    const h = hd.querySelector(':scope > h2.h-sec'); if(!h) return;
    const body = hd.nextElementSibling; if(!body || body.querySelector(':scope > h2.h-sec') || body.matches('.between')) return;
    const key = r + ':' + (h.textContent || '').replace(/[0-9]+/g, '').trim(); if(!key.split(':')[1]) return;
    h.style.cursor = 'pointer'; h.setAttribute('role', 'button'); h.setAttribute('tabindex', '0');
    h.insertAdjacentHTML('beforeend', '<span class="foldchev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>');
    const apply = () => { const c = FOLD.has(key); body.style.display = c ? 'none' : ''; h.classList.toggle('folded', c); h.setAttribute('aria-expanded', String(!c)); };
    const toggle = () => { FOLD.has(key) ? FOLD.delete(key) : FOLD.add(key); try{ localStorage.setItem('cr_fold', JSON.stringify([...FOLD])); }catch(_){} apply(); };
    h.addEventListener('click', toggle); h.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } });
    apply();
  });
}

/* ---------- Sheets ---------- */
function sheet(title, fields, onSave, extra=''){
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="scrim" role="dialog" aria-modal="true" aria-label="${esc(title)}"><form class="sheet" id="sheetForm"><div class="grab"></div>
    <h2 class="h-sec" style="margin-bottom:16px">${esc(title)}</h2><div id="draftSlot"></div>${fields}
    <div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn" type="submit" style="flex:1">Speichern</button><button class="btn alt" type="button" data-close>Abbrechen</button></div>${extra}</form></div>`;
  const form = $('#sheetForm');
  /* Entwürfe: jede Eingabe wird lokal gesichert; Schließen nur über „Abbrechen“ */
  const snap = () => [...form.elements].filter(e => e.name && e.type !== 'file').map(e => [e.name, e.value, e.type === 'checkbox' || e.type === 'radio' ? e.checked : null]);
  const initial = JSON.stringify(snap());
  let h = 0; for(const ch of title + initial) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const key = 'cr_draft_' + h.toString(36);
  const dirty = () => JSON.stringify(snap()) !== initial;
  const apply = data => { const els = [...form.elements].filter(e => e.name && e.type !== 'file');
    data.forEach(([n, v, c], i) => { const e = els[i]; if(!e || e.name !== n) return; if(c === null) e.value = v; else e.checked = c; }); };
  let saved = null; try{ saved = JSON.parse(localStorage.getItem(key) || 'null'); }catch(_){}
  if(saved && saved.data && JSON.stringify(saved.data) !== initial){
    apply(saved.data);
    $('#draftSlot').innerHTML = `<div class="draftnote"><span>Entwurf vom ${new Date(saved.at).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} wiederhergestellt</span><button type="button" id="draftDrop">Verwerfen</button></div>`;
    $('#draftDrop').onclick = () => { apply(JSON.parse(initial)); try{ localStorage.removeItem(key); }catch(_){} $('#draftSlot').innerHTML = ''; };
  }
  const store = () => { try{ if(dirty()) localStorage.setItem(key, JSON.stringify({at:Date.now(), data:snap()})); else localStorage.removeItem(key); }catch(_){} };
  form.addEventListener('input', store); form.addEventListener('change', store);
  const close = () => { root.innerHTML = ''; };
  const cancel = form.querySelector('[data-close]');
  cancel.onclick = () => {
    if(dirty() && !cancel.dataset.sure){ cancel.dataset.sure = 1; cancel.textContent = 'Änderungen verwerfen?'; cancel.style.color = 'var(--danger)'; setTimeout(() => { if(cancel.isConnected){ delete cancel.dataset.sure; cancel.textContent = 'Abbrechen'; cancel.style.color = ''; } }, 4000); return; }
    try{ localStorage.removeItem(key); }catch(_){} close();
  };
  form.onsubmit = async e => { e.preventDefault(); const fd = Object.fromEntries(new FormData(form)); if(await onSave(fd, form) !== false){ try{ localStorage.removeItem(key); }catch(_){} close(); } };
  bindChecks(form);
  setTimeout(() => form.querySelector('input:not([type=checkbox]),select')?.focus(), 60);
  return form;
}

    <div class="field"><span class="flabel">BETEILIGTE · MASTER- UND PUBLISHING-ANTEILE JE 100 %</span><div id="crList">${(t.credits||[]).map(creditRow).join('')}</div>
    <button class="pill" type="button" id="crAdd" style="margin-top:8px;min-height:34px">${icon.plus} Person</button>
    <div class="small" id="crSum" style="margin-top:10px"></div></div>`;
  const form = sheet('Credits & Splits · ' + t.title, fields, async (fd, f) => {
    const credits = [...f.querySelectorAll('.crow')].map(r => ({n:r.querySelector('[name=cr_n]').value.trim(), r:r.querySelector('[name=cr_r]').value, m:num(r.querySelector('[name=cr_m]').value), p:num(r.querySelector('[name=cr_p]').value)})).filter(c => c.n);
    return await put('tracks', tid, {isrc:(fd.isrc||'').trim().toUpperCase(), credits}) ? undefined : false;
  });
  const list = form.querySelector('#crList');
  const sum = () => { const rows = [...list.querySelectorAll('.crow')], m = rows.reduce((a,r) => a + num(r.querySelector('[name=cr_m]').value), 0), pb = rows.reduce((a,r) => a + num(r.querySelector('[name=cr_p]').value), 0);
    form.querySelector('#crSum').innerHTML = `<span class="apv" style="--n:${Math.round(m) === 100 ? '#39FF88' : '#FF3B5C'}">MASTER ${Math.round(m*10)/10} %</span> <span class="apv" style="--n:${Math.round(pb) === 100 ? '#39FF88' : '#FF3B5C'}">PUBLISHING ${Math.round(pb*10)/10} %</span>`; };
  const wire = row => { row.querySelector('.crdel').onclick = () => { row.remove(); sum(); }; row.querySelectorAll('input').forEach(i => i.addEventListener('input', sum)); };
  list.querySelectorAll('.crow').forEach(wire);
  form.querySelector('#crAdd').onclick = () => { list.insertAdjacentHTML('beforeend', creditRow({})); wire(list.lastElementChild); list.lastElementChild.querySelector('input').focus(); sum(); };
  if(!(t.credits||[]).length){ const p = person(S.releases[t.release]?.artist); list.insertAdjacentHTML('beforeend', creditRow({n:p?.name||'', r:'Artist'}) + creditRow({n:t.producer||'', r:'Produzent'})); list.querySelectorAll('.crow').forEach(wire); }
  sum();
}
function sheetVersion(tid){
  const t = S.tracks[tid], r = S.releases[t.release], p = person(r.artist);
  const n = versionsOf(tid).length + 1;
  const fields = `<p class="small" style="margin:0 0 12px">In Dropbox bei der Datei auf <b>Teilen</b> → <b>Link kopieren</b> tippen und hier einfügen. Die Datei bleibt in voller Qualität in Dropbox.${safeUrl(p.dropbox) ? ` <a href="${esc(p.dropbox)}" target="_blank" rel="noopener" style="font-weight:700">Ordner ${esc(p.name)} öffnen</a>` : ''}</p>
    ${F('link','DROPBOX-LINK','','url','required placeholder="https://www.dropbox.com/…"')}
    <div class="grid2">${F('label','BEZEICHNUNG','Mix v'+n,'text','required')}${Sel('kind','ART',KINDS,'Mix')}</div>
    ${Sel('by','VON',Object.entries(OWNERS), account?.role === 'artist' ? 'A' : 'P')}`;
  sheet('Neue Version', fields, async fd => {
    const link = (fd.link || '').trim();
    if(!/^https:\/\//.test(link)){ toast('Link muss mit https:// beginnen'); return false; }
    return await put('versions', uid('v'), {track:tid, label:fd.label.trim(), kind:fd.kind, by:fd.by, link, at:new Date().toISOString()}, false) ? undefined : false;
  });
}

/* ---------- Start: Supabase-Anbindung ----------
   Die App spricht intern eine kleine Dokumenten-API (collection/doc/onSnapshot).
   Hier wird sie auf eine Supabase-Tabelle "docs" (col, id, data) abgebildet.
   Login: Benutzername + Passwort; intern wird daraus benutzername@EMAIL_DOMAIN. */
let sb = null, account = null;
const CFG = window.CLOUDS_CONFIG || {};

function makeDb(client){
  const cache = {}, meta = {};  // col -> {id: data} / {id: {at, by}}
  const subs = {};         // col -> [callback]
  const emit = col => (subs[col]||[]).forEach(cb => cb({docs: Object.entries(cache[col]||{}).map(([id,d]) => ({id, data: () => ({...d, _at: meta[col]?.[id]?.at || '', _by: meta[col]?.[id]?.by || ''})}))}));
  const setLocal = (col, id, d, m) => { (cache[col] ||= {}); (meta[col] ||= {}); if(d === null){ delete cache[col][id]; delete meta[col][id]; } else { cache[col][id] = d; meta[col][id] = m || {at: new Date().toISOString(), by: me}; } emit(col); };
  let channel = null;
  const ensureChannel = () => {
    if(channel && channel.state === 'joined') return;
    if(channel){ try{ client.removeChannel(channel); }catch(_){} channel = null; }
    channel = client.channel('docs-live')
      .on('postgres_changes', {event:'*', schema:'public', table:'docs'}, p => {
        const row = p.new && p.new.col ? p.new : p.old;
        if(!row || !row.col) return;
        if(p.eventType === 'DELETE') setLocal(row.col, row.id, null);
        else setLocal(row.col, row.id, p.new.data || {}, {at: p.new.updated_at, by: p.new.updated_by});
      })
      .subscribe();
  };
  const fail = error => { const e = new Error(error.message || 'Fehler'); e.code = error.code === '42501' ? 'not_granted' : error.code; throw e; };
  /* Nach Rückkehr aus dem Hintergrund (iPhone schläft die App ein): Live-Verbindung neu und alles frisch laden */
  const refresh = async () => {
    ensureChannel();
    for(const col of Object.keys(subs)){
      const {data, error} = await client.from('docs').select('id,data,updated_at,updated_by').eq('col', col).limit(1000);
      if(error) continue;
      cache[col] = {}; meta[col] = {}; (data||[]).forEach(r => { cache[col][r.id] = r.data || {}; meta[col][r.id] = {at: r.updated_at, by: r.updated_by}; });
      emit(col);
    }
  };
  return {
    refresh,
    collection(col){
      return {
        doc(id){
          return {
            async set(data){
              const {error} = await client.from('docs').upsert({col, id, data});
              if(error) fail(error);
              setLocal(col, id, data);
            },
            async update(patch){
              const {data, error} = await client.rpc('doc_merge', {p_col: col, p_id: id, p_patch: patch});
              if(error) fail(error);
              setLocal(col, id, data || {...(cache[col]?.[id]||{}), ...patch});
            },
            async delete(){
              const {error} = await client.from('docs').delete().eq('col', col).eq('id', id);
              if(error) fail(error);
              setLocal(col, id, null);
            }
          };
        },
        limit(n){
          return {
            onSnapshot(cb, onErr){
              (subs[col] ||= []).push(cb);
              ensureChannel();
              client.from('docs').select('id,data,updated_at,updated_by').eq('col', col).limit(n).then(({data, error}) => {
                if(error){ onErr && onErr(error); return; }
                cache[col] = {}; meta[col] = {}; (data||[]).forEach(r => { cache[col][r.id] = r.data || {}; meta[col][r.id] = {at: r.updated_at, by: r.updated_by}; });
                emit(col);
              });
            }
          };
        }
      };
    }
  };
}

function showLogin(msg){
  $('#login').hidden = false;
  $('#loginErr').textContent = msg || '';
}
async function logout(){
  try{ await sb.auth.signOut(); }catch(_){}
  location.reload();
}
function accountFrom(u){
  const uname = (u.email||'').split('@')[0];
  return {id: u.id, name: u.user_metadata?.name || (uname.charAt(0).toUpperCase() + uname.slice(1)), username: uname};
}
async function boot(session){
  account = accountFrom(session.user);
  me = account.id;
  user = {me: async () => ({name: account.name}), id: async () => account.id};
  const {data: mem, error: memErr} = await sb.from('members').select('role, person').eq('user_id', account.id).maybeSingle();
  if(memErr || !mem){ await sb.auth.signOut(); showLogin(memErr ? 'Verbindung fehlgeschlagen. Bitte erneut versuchen.' : 'Ihr Zugang ist noch nicht freigeschaltet.'); return; }
  account.role = mem.role;
  if(mem.role === 'artist'){ lockedArtist = mem.person; }
  db = makeDb(sb);
  dbState = 'on';
  $('#login').hidden = true;
  if(pushSupported()) navigator.serviceWorker.register('sw.js').then(() => pushState()).then(() => render()).catch(() => {});
  if(lockedArtist){ stack.length = 0; stack.push({r:'artiststart', id: lockedArtist, preview: lockedArtist}); }
  else if(mem.role === 'producer' && mem.person){ myProducer = mem.person; stack.length = 0; stack.push({r:'pmonth', id: mem.person}); }
  else if(stack.length === 1 && stack[0].r === 'roster'){ stack.length = 0; stack.push({r:'pin'}); }  /* Team startet auf „Start“ (Pinnwand + Kalender) */
  if(lockedArtist) sb.rpc('label_releases').then(({data}) => { S.labelRels = data || []; render(); }).catch(() => {});
  COLS.forEach(c => db.collection(c).limit(1000).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => o[d.id] = {id:d.id, ...d.data()});
    S[c] = o; loaded.add(c); render(); if(c === 'chat') refreshChats();
  }, err => { toast('Daten konnten nicht geladen werden: ' + err.message); }));
  render();
}

$('#miniClose').onclick = () => { const a = $('#miniAudio'); a.pause(); a.removeAttribute('src'); a.load(); delete a.dataset.vid; $('#mini').hidden = true; document.body.classList.remove('hasmini'); };
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button');
  const uname = f.username.value.trim().toLowerCase().replace(/\s+/g,'');
  if(!uname || !f.password.value) return;
  const email = uname.includes('@') ? uname : `${uname}@${CFG.EMAIL_DOMAIN}`;
  btn.disabled = true; $('#loginErr').textContent = '';
  const {data, error} = await sb.auth.signInWithPassword({email, password: f.password.value});
  btn.disabled = false;
  if(error){ $('#loginErr').textContent = 'Benutzername oder Passwort stimmt nicht.'; return; }
  f.password.value = '';
  boot(data.session);
});

/* Automatisches Update: neue Version erkennen und neu laden (umgeht den Zwischenspeicher von GitHub/iPhone) */
const APP_VERSION = '202611140720';
async function checkUpdate(){
  try{
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    const j = await r.json();
    if(j.v && j.v !== APP_VERSION){ location.replace(location.pathname + '?v=' + j.v); }
  }catch(_){}
}
checkUpdate();
let lastRefresh = Date.now();
document.addEventListener('visibilitychange', () => { if(document.hidden) return; checkUpdate(); if(db && Date.now() - lastRefresh > 3000){ lastRefresh = Date.now(); db.refresh().then(refreshChats).catch(() => {}); } });
window.addEventListener('focus', () => { if(db && Date.now() - lastRefresh > 3000){ lastRefresh = Date.now(); db.refresh().then(refreshChats).catch(() => {}); } });
window.addEventListener('pageshow', e => { if(e.persisted && db){ lastRefresh = Date.now(); db.refresh().catch(() => {}); } });

render();
(async () => {
  if(!window.supabase || !CFG.SUPABASE_URL || /DEIN-PROJEKT/.test(CFG.SUPABASE_URL)){
    dbState = 'off'; render();
    showLogin('Die App ist noch nicht mit der Datenbank verbunden (config.js).');
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
  const {data:{session}} = await sb.auth.getSession();
  if(session) boot(session); else showLogin();
})();
</script>
