<style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);background:#0C1B31}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#0C1B31;color:#F4F4F5}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Questrial&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Design „Navy + Neon“ (Variante B) (CloudStudios-Branding): Navy #0c1b31, Blitz-Gelb #ffcc00, Questrial + Anton */
:root{
  --frame:#08142A; --paper:#0C1B31; --card:#13284A; --raise:#1A3259; --line:#22395F; --line2:#2E4A75;
  --ink:#FFFFFF; --ink2:#DCE3EE; --mute:#9AA6B8; --soft:#7A879C; --cloud:#102341;
  --sun:#FFCC00; --on-sun:#0C1B31; --sun-bg:rgba(255,204,0,.14);
  --single:#5B8DEF; --ep:#E0703F; --album:#3FAE7F; --danger:#F26D6D;
  --display:'Questrial','Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --head:'Anton','Impact',sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme:dark;
}
/* Vollbild als Home-Bildschirm-App: alles in der App-Farbe, auch hinter Statusleiste und Home-Balken */
html{background:var(--paper);min-height:100%}
html,body{height:100%}
body{background:var(--paper);overscroll-behavior-y:none;color:var(--ink);font-family:var(--display);font-size:16px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:6px}
.app{max-width:430px;margin:0 auto;min-height:100%;min-height:calc(100dvh - env(safe-area-inset-top,0px));box-sizing:border-box;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow-x:hidden}
#view{flex:1;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));position:relative}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--mute)}
.small{font-family:var(--mono);font-size:11px;color:var(--mute)}
.pad{padding-inline:20px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column}
h1,h2{margin:0;text-wrap:balance}
.h-giant{font-family:var(--head);font-weight:400;font-size:42px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase}
.h-big{font-family:var(--head);font-weight:400;font-size:34px;line-height:1.04;letter-spacing:.01em;text-transform:uppercase}
.h-sec{font-weight:600;font-size:20px;letter-spacing:-.01em}
.cloudbg{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0;position:relative;min-height:56px}
.brand{display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.brand svg{flex:none}
.brand b{font-family:var(--head);font-weight:400;font-size:18px;letter-spacing:.06em;line-height:1;display:inline-flex;align-items:center;gap:6px}
.brand .bolt{flex:none}
.yearpill{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--sun);border:1px solid var(--sun);border-radius:20px;padding:4px 10px;white-space:nowrap}
.nextcard{margin:10px 16px 0;background:var(--sun);color:var(--on-sun);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.nextcard .tc-bar{background:rgba(12,27,49,.2);height:6px;border-radius:3px}.nextcard .tc-bar i{background:var(--on-sun)}
.nextcard .pill.navy{background:var(--on-sun);color:var(--sun);border-color:var(--on-sun)}
.nextcard .pill.nvline{background:transparent;color:var(--on-sun);border-color:var(--on-sun)}
.brand i{display:block;font-style:normal;font-size:10.5px;color:var(--mute);letter-spacing:.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.ahead .brand i,.starthero .brand i{color:rgba(255,255,255,.85)}
.sticker.tilt3{background:var(--sun);color:var(--on-sun)}
.back{min-height:44px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-size:14px;font-weight:500;color:var(--ink2);background:none;border:0;padding:0 4px 0 0;cursor:pointer}
.topacts .iconbtn{width:40px;height:40px;min-width:40px}
.iconbtn{width:40px;height:40px;border-radius:20px;border:0;background:var(--raise);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn.ghost{background:transparent;border:1px solid var(--line2)}
.sticker{font-family:var(--mono);font-size:11px;font-weight:600;padding:4px 8px;background:var(--sun-bg);color:var(--sun);border:0;border-radius:6px;display:inline-block;white-space:nowrap}
.tilt,.tilt3{transform:none}
.chip{font-family:var(--mono);font-size:11px;font-weight:600;padding:5px 9px;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap;border:0}
.pill{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line2);background:var(--raise);color:var(--ink);font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.pill.on{background:var(--raise);color:var(--ink);border-color:var(--ink)}
.pill.sun{background:var(--sun);color:var(--on-sun);border-color:var(--sun)}
.pill.dash{border-style:dashed;background:transparent}
.legend{display:flex;gap:16px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.boxes{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.box{width:12px;height:12px;border-radius:3px;border:1px solid currentColor;opacity:.55;display:inline-block}
.box.fill{background:currentColor;opacity:1}
.box.wip{opacity:1;background:repeating-linear-gradient(45deg,currentColor 0 2px,transparent 2px 5px)}
.gap8{width:8px}
.c-single{color:var(--single)}.c-ep{color:var(--ep)}.c-album{color:var(--album)}
.list{display:flex;flex-direction:column;gap:10px;padding:16px 20px}
.acard{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;padding:14px;width:100%;transition:background .15s}
.acard:hover{background:var(--raise)}
.acard .swatch{width:52px;height:52px;flex:none;border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.acard .swatch span{font-weight:700;font-size:22px;line-height:1;color:#fff !important}
.acard .body{flex:1;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.acard .name{font-weight:600;font-size:18px}
.status{font-family:var(--mono);font-size:11px;font-weight:600}
.tilegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:16px 20px 8px}
.tilecard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:0;cursor:pointer;text-align:left;color:var(--ink);transition:background .15s}
.tilecard:hover{background:var(--raise)}
.tc-art{aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tc-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tc-ini{font-size:64px;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:-.04em}
.tc-new{position:absolute;right:8px;top:8px;font-family:var(--mono);font-size:10px;font-weight:600;background:var(--sun);color:var(--on-sun);padding:3px 7px;border-radius:5px}
.tc-yr{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:10px;font-weight:600;background:rgba(12,27,49,.72);color:#fff;padding:3px 6px;border-radius:5px}
.tc-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.tc-name{font-weight:600;font-size:17px}
.tc-body .status{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.beattile .tc-art{overflow:hidden}
.bt-wave{position:absolute;left:10%;right:10%;bottom:18%;height:28%;display:flex;align-items:flex-end;gap:3px;opacity:.35}
.bt-wave i{flex:1;background:#fff;border-radius:2px}.bt-wave i:nth-child(3n){height:40%}.bt-wave i:nth-child(3n+1){height:85%}.bt-wave i:nth-child(3n+2){height:60%}.bt-wave i:nth-child(5n){height:100%}
.bt-play{position:relative;width:56px;height:56px;border-radius:28px;background:var(--sun);color:var(--on-sun);display:flex;align-items:center;justify-content:center;text-decoration:none}
.bt-fav{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:16px;border:0;background:rgba(12,27,49,.55);color:#fff;font-size:16px;cursor:pointer}.bt-fav.on{color:var(--sun)}
.prodtile .tc-art{aspect-ratio:16/9}
.tc-bar{height:4px;border-radius:2px;background:var(--raise);overflow:hidden}.tc-bar i{display:block;height:100%}
.pcard{display:flex;align-items:center;gap:14px;color:var(--ink);background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.avatar{overflow:hidden;position:relative;width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:19px;flex:none}
.navbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(min(430px,100%) - 24px);display:grid;background:rgba(19,40,74,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line2);border-radius:22px;padding:6px;z-index:20}
.navbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;background:transparent;border:0;color:var(--mute);font-size:11px;cursor:pointer}
.navbar button.on{background:var(--raise);color:var(--sun);font-weight:600}
.navbar button{min-width:0}
.navbar.n8 button{font-size:9.5px;letter-spacing:-.02em;padding:8px 0 7px}
.navbar.n8 button svg{width:18px;height:18px}
.ahead{margin:0;padding:0 20px 24px;position:relative;overflow:hidden;color:#fff}
.ahead.hasphoto{min-height:380px;display:flex;flex-direction:column}.ahead.hasphoto > .between{margin-bottom:auto}
.aheadimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%}
.aheadshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,27,49,.55) 0%,rgba(12,27,49,0) 30%,rgba(12,27,49,.35) 55%,#0C1B31 100%)}
.starthero{position:relative;overflow:hidden;min-height:440px;display:flex;flex-direction:column}
.starthero .aheadimg{object-position:center 22%}
.starthero > .topbar,.starthero > .pad{position:relative;z-index:2}
.starthero > [data-heroin]{margin-top:auto;padding-bottom:6px}
.starthero .h-giant{text-shadow:0 2px 18px rgba(12,27,49,.6)}
.starthero .small{color:#DCE3EE}
.heroprof{position:absolute;inset:0;z-index:1;background:none;border:0;padding:0;cursor:pointer}
.ahead .bigini{position:absolute;right:-20px;top:-10px;font-weight:700;font-size:200px;line-height:1;opacity:.12;pointer-events:none}
.counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.counter{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px}
.counter b{display:block;font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.counter span{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em}
.yearhead{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.yearhead .lbl{color:var(--ink2)}
.yearhead i{flex:1;height:1px;background:var(--line2)}
.rrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;cursor:pointer;width:100%;text-align:left;margin-bottom:8px;color:var(--ink)}
.rrow.now{border-color:var(--sun)}
.rrow.done{opacity:1;border-color:rgba(57,255,136,.28)}
.cover{width:56px;height:56px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:6px;color:#fff;font-family:var(--mono);font-weight:600;font-size:10px}
.cover svg{display:none}
.rrow .t{font-weight:600;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rhero{margin:8px 16px 0;height:260px;border-radius:22px;color:#fff;position:relative;overflow:hidden;border:1px solid var(--line)}
.rhero::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.55) 100%)}
.rhero .vinyl{display:none}
.team{display:flex}
.team span{position:relative;overflow:hidden;width:34px;height:34px;border-radius:17px;border:2px solid var(--paper);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;margin-left:-8px}
.team span:first-child{margin-left:0}
.steps{padding:10px 20px 0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:48px 24px minmax(0,1fr);align-items:start}
.step .ph{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--mute);padding-top:3px}
.step .rail{display:flex;flex-direction:column;align-items:center}
.dot{width:20px;height:20px;border-radius:10px;border:1.5px solid var(--line2);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--on-sun)}
.dot.ok{background:var(--ink2);border-color:var(--ink2)}
.dot.cur{background:var(--sun);border-color:var(--sun)}
.line{width:1.5px;height:26px;background:repeating-linear-gradient(180deg,var(--line2) 0 4px,transparent 4px 8px)}
.line.solid{background:var(--ink2)}
.stxt{font-size:15px;padding:1px 0 0;background:none;border:0;text-align:left;cursor:pointer;min-height:30px;color:var(--ink)}
.stxt.ok{color:var(--mute);text-decoration:line-through}
.stxt.cur{background:var(--card);border:1px solid var(--sun);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;margin-bottom:10px;width:100%}
.diamond{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--ink2);transform:rotate(45deg)}
.vrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.vrow.top{border-color:var(--line2);background:var(--raise)}
.vrow .play{width:42px;height:42px;flex:none;border-radius:12px;background:var(--raise);color:var(--ink);display:flex;align-items:center;justify-content:center}
.player{margin:16px 16px 0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.bigplay{width:56px;height:56px;flex:none;border-radius:28px;background:var(--sun);color:var(--on-sun);display:flex;align-items:center;justify-content:center;text-decoration:none}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.composer{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:0 6px 0 12px;min-height:48px}
.composer input{border:0;outline:none;background:transparent;font-size:15px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 20px 0}
.tile{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--card)}
.tile b{display:block;font-size:36px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile.hot{background:var(--sun-bg);border-color:rgba(255,204,0,.35)}
.tile.hot b{color:var(--sun)}
.tile.dark{background:var(--raise)}
.bar{height:8px;border-radius:4px;background:var(--raise);overflow:hidden;border:0}
.bar i{display:block;height:100%}
.empty{margin:16px 20px;border:1px dashed var(--line2);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--ink2)}
.check{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.check .box2{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--on-sun)}
.check.ok .box2{background:var(--sun);border-color:var(--sun)}
.check.ok .tt{text-decoration:line-through;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 2px;scrollbar-width:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(430px,100%);max-height:88vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;border:1px solid var(--line2);border-bottom:0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.flabel{display:block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--mute);margin-bottom:8px}
.favbtn{flex:none;width:34px;height:34px;border-radius:17px;border:1px solid var(--line2);background:none;color:var(--mute);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.favbtn.on{color:var(--sun);border-color:rgba(255,204,0,.5);background:var(--sun-bg)}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.gchip input{position:absolute;opacity:0;pointer-events:none}
.gchip span{font-family:Inter,system-ui,sans-serif;letter-spacing:0;display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line2);background:var(--paper);color:var(--ink2);font-size:13px;cursor:pointer;user-select:none}
.gchip input:checked+span{background:var(--sun);color:var(--on-sun);border-color:var(--sun);font-weight:600}
.gchip input:focus-visible+span{outline:2px solid var(--sun);outline-offset:2px}
.draftnote{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sun-bg);border:1px solid rgba(255,204,0,.35);border-radius:12px;padding:8px 12px;margin:-4px 0 14px;font-size:13px}
.draftnote button{background:none;border:0;color:var(--sun);font-weight:700;cursor:pointer;font-size:13px}
/* Tablet & Desktop: volle Breite nutzen */
@media (min-width:700px){
  .app{max-width:none}
  #view{width:100%;max-width:1180px;margin:0 auto;box-sizing:border-box;padding-left:12px;padding-right:12px}
  .tilegrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .h-giant{font-size:52px}
  .navbar{width:min(620px,calc(100% - 24px))}
  .mini{width:min(620px,calc(100% - 24px))}
  .scrim{align-items:center}
  .sheet{width:min(560px,calc(100% - 32px));border-radius:24px;border-bottom:1px solid var(--line2);max-height:86vh}
  .toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:1100px){
  .tilegrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .list>.pcard{max-width:560px}
}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.acard{transition:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--mute)}
.field input,.field select,.field textarea{min-height:46px;border:1px solid var(--line2);border-radius:12px;background:var(--paper);padding:10px 12px;font-size:16px;width:100%;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* Datum/Uhrzeit: iOS zeichnet diese Felder sonst höher, zentriert und breiter als die anderen */
.field input[type=date],.field input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:46px;line-height:24px;text-align:left}
.field input[type=date]::-webkit-date-and-time-value,.field input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.field input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8)}
.field select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
/* Zwei Felder nebeneinander mit Datum: auf dem Handy untereinander, damit nichts überlappt */
@media (max-width:560px){ .grid2:has(input[type=date]),.grid2:has(input[type=time]){grid-template-columns:1fr} }
/* Notizfelder überall großzügig, nach unten aufziehbar */
.field textarea{min-height:110px;resize:vertical;line-height:1.45}
.field textarea[name=note],.field textarea[name=concept],.field textarea[name=text]{min-height:150px}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rooms .gchip{display:block;position:relative}
.rooms .gchip span{width:100%;min-height:42px;justify-content:center;text-align:center;border-radius:12px}
.rooms .gchip:last-child:nth-child(odd){grid-column:1/-1}
.apv{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--n);border:1px solid var(--n);border-radius:8px;padding:3px 7px;box-shadow:0 0 10px color-mix(in srgb,var(--n) 55%,transparent),inset 0 0 8px color-mix(in srgb,var(--n) 25%,transparent);text-shadow:0 0 8px color-mix(in srgb,var(--n) 70%,transparent);white-space:nowrap}
.apv.big{font-size:13px;padding:8px 12px;border-radius:12px}
.apvbtn{flex:1;min-height:48px;border-radius:14px;border:1.5px solid var(--n);background:color-mix(in srgb,var(--n) 12%,transparent);color:var(--n);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 0 14px color-mix(in srgb,var(--n) 40%,transparent);text-shadow:0 0 8px color-mix(in srgb,var(--n) 60%,transparent)}
.vrow.apvrow{border-color:color-mix(in srgb,var(--n) 60%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--n) 22%,transparent)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.calhd{font-family:var(--mono);font-size:10px;color:var(--mute);text-align:center;padding:4px 0}
.calday{aspect-ratio:1/1.05;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0}
.calday.today{border-color:var(--sun);color:var(--sun);font-weight:700}
.calday.sel{background:var(--sun);color:var(--on-sun);border-color:var(--sun)}
.foldchev{display:inline-flex;vertical-align:middle;margin-left:8px;color:var(--mute);transition:transform .18s ease}
h2.folded .foldchev{transform:rotate(-90deg)}
/* ---------- Team-Design: Neon-Hintergrund + „Liquid Glass“ (nur interne Konten, 13.11.2026) ---------- */
body.teamui{background:transparent}
body.teamui::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,16,31,.10) 0%,rgba(6,16,31,.22) 40%,rgba(6,16,31,.55) 100%),url('img/bg-portrait.jpg') center 40%/cover no-repeat}

body.teamui .scrim{background:rgba(0,0,0,.45)}

body.teamui .calday.sel{background:var(--sun);border-color:var(--sun)}
body.teamui .calday.today{border-color:var(--sun)}

body.teamui .h-giant,body.teamui .h-big,body.teamui .h-sec{text-shadow:0 2px 14px rgba(0,0,0,.55)}
body.teamui .small{text-shadow:0 1px 6px rgba(0,0,0,.5)}

<script>
/* ---------- Konstanten ---------- */
const TYPE = {
  'Single':      {c:'#4F7FE6', key:'single', short:'Single'},
  'Vorab-Single':{c:'#4F7FE6', key:'single', short:'Vorab-Single'},
  'Song':        {c:'#B8735A', key:'song',   short:'Song'},
  'EP':          {c:'#D9673A', key:'ep',     short:'EP'},
  'Album':       {c:'#2E9C70', key:'album',  short:'Album'}
};
const STAGES = ['Idee','Geplant','Writing','Recording','Mix','Master','Distribution','Promo','Released'];
const PHASES = ['T-12','T-10','T-8','T-6','T-4','T-2','T-0','Nach Release'];
const PHASE_WEEKS = {'T-12':12,'T-10':10,'T-8':8,'T-6':6,'T-4':4,'T-2':2,'T-0':0,'Nach Release':-2};
const OWNERS = {A:'Artist', P:'Produzent', N:'Nikolina', K:'Kacper', C:'Cem', TH:'Thorben', T:'Team'};
const HELPER_KEYS = ['C','K','N','TH','P'];
const helpersOf = x => Array.isArray(x?.helpers) ? x.helpers.filter(k => k !== x.owner && OWNERS[k]) : [];
const ownerName = (k, x) => k === 'P' ? (producers()[0]?.name || OWNERS.P) : (OWNERS[k] || S.people?.[k]?.name || k);
const withHelpers = x => helpersOf(x).length ? ' + ' + helpersOf(x).map(k => ownerName(k, x)).join(' + ') : '';
const HelpChips = x => `<div class="field"><span class="flabel">ZUSÄTZLICH ZUSTÄNDIG (OPTIONAL, MEHRFACH)</span><div class="gchips">${HELPER_KEYS.map(k => `<label class="gchip"><input type="checkbox" name="helpers" value="${k}" ${helpersOf(x).includes(k) ? 'checked' : ''}><span>${esc(ownerName(k, x))}</span></label>`).join('')}</div></div>`;
/* Checklisten-Punkt: mehrere Zuständige (os); o = erste/Haupt-Person (Artist immer zuerst, wegen Datenbank-Regeln) */
const chkOwners = c => Array.isArray(c?.os) && c.os.length ? c.os : (c?.o ? [c.o] : []);
const chkHas = (c, k) => chkOwners(c).includes(k);
const chkNames = (c, artistName) => chkOwners(c).map(k => k === 'A' ? (artistName || 'Artist') : (S.people?.[k]?.role === 'Artist' ? S.people[k].name : ownerName(k))).join(' + ');
const checksOf = x => Array.isArray(x?.checks) ? x.checks.filter(c => c && c.t) : [];
const checkTxt = x => { const c = checksOf(x); return c.length ? ` · ☑ ${c.filter(i => i.d).length}/${c.length}` : ''; };
const CheckList = x => `<div class="field"><span class="flabel">CHECKLISTE (UNTERPUNKTE)</span><div class="stack" id="chkList" style="gap:6px">${checksOf(x).map((c,i) => chkRow(c, i)).join('')}</div>
  <button class="pill" type="button" id="chkAdd" style="margin-top:8px;min-height:34px">${icon.plus} Punkt</button></div>`;
let CHK_CTX = null; /* {artist:'Name', extra:[[id, name]]} – bei Auftritten: Co-Artists auswählbar */
const CHK_OWNERS = () => [['','Wer? (optional)'],['A', CHK_CTX?.artist || 'Artist'], ...(CHK_CTX?.extra || []),['P',ownerName('P')],['C','Cem'],['K','Kacper'],['N','Nikolina'],['TH','Thorben']];
const chkRow = (c, i) => `<div class="chkrow" style="display:flex;flex-direction:column;gap:4px;padding:6px 0;border-bottom:1px solid var(--line)"><div class="row" style="gap:8px"><input type="checkbox" name="chk_d" ${c.d ? 'checked' : ''} style="width:20px;height:20px;flex:none"><input name="chk_t" value="${esc(c.t||'')}" placeholder="z. B. Location anfragen" style="flex:1;min-height:38px;border-radius:10px;background:var(--paper);color:var(--ink);border:1px solid var(--line2);padding:0 10px;font-size:15px;${c.d ? 'text-decoration:line-through;color:var(--mute)' : ''}"><button type="button" class="iconbtn ghost chkdel" aria-label="Punkt entfernen" style="width:34px;height:34px;flex:none">×</button></div>
  <div class="row" style="gap:6px;margin-left:28px;width:calc(100% - 70px)"><input name="chk_l" type="url" value="${esc(c.l||'')}" placeholder="Link (optional), z. B. Dropbox" style="flex:1;min-width:0;min-height:34px;border-radius:10px;background:var(--paper);color:var(--ink);border:1px solid var(--line2);padding:0 10px;font-size:13px">${safeUrl(c.l) ? `<a href="${esc(c.l)}" target="_blank" rel="noopener" class="small" style="color:var(--sun);font-weight:700;flex:none;text-decoration:none">ÖFFNEN</a>` : ''}</div>
  <div class="gchips" aria-label="Zuständig für diesen Punkt (mehrere möglich)" style="margin-left:28px;width:calc(100% - 70px)">${CHK_OWNERS().filter(([v]) => v).map(([v,l]) => `<label class="gchip"><input type="checkbox" class="chko" value="${v}" ${chkOwners(c).includes(v) ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div></div>`;
function bindChecks(form){
  const list = form.querySelector('#chkList'); if(!list) return;
  const wire = row => { row.querySelector('.chkdel').onclick = () => { row.remove(); form.dispatchEvent(new Event('input')); }; };
  list.querySelectorAll('.chkrow').forEach(wire);
  form.querySelector('#chkAdd').onclick = () => { list.insertAdjacentHTML('beforeend', chkRow({t:'', d:false})); const r = list.lastElementChild; wire(r); r.querySelector('input[name=chk_t]').focus(); };
}
const readChecks = form => [...form.querySelectorAll('.chkrow')].map(r => { let os = [...r.querySelectorAll('input.chko:checked')].map(i => i.value); if(os.includes('A')) os = ['A', ...os.filter(k => k !== 'A')]; const l = safeUrl((r.querySelector('input[name=chk_l]')?.value || '').trim()); return {t:r.querySelector('input[name=chk_t]').value.trim(), d:r.querySelector('input[name=chk_d]').checked, ...(os.length ? {o: os[0]} : {}), ...(os.length > 1 ? {os} : {}), ...(l ? {l} : {})}; }).filter(c => c.t);
const readHelpers = (form, owner) => [...form.querySelectorAll('input[name=helpers]:checked')].map(i => i.value).filter(k => k !== owner);
const OWNER_COL = {A:null, P:'#FFCC00', N:'#A1A1AA', T:'#71717A'};
const KINDS = ['Demo','Vocals','Beat','Mix','Master','Stems'];
const TEMPLATE = [
  ['T-12','Song geschrieben','A'],
  ['T-12','Demo im System','A'],
  ['T-12','Recording bei CloudStudios','A'],
  ['T-10','Fotoshooting-Tag (Cover & Pressefotos)','N'],
  ['T-8','Mix & Master final','P'],
  ['T-8','Cover fertig','N'],
  ['T-6','Videodreh-Tag & Reels (Regie Niki)','N'],
  ['T-6','Distributor-Upload, ISRC','K'],
  ['T-4','Spotify-Pitch & Promo-Plan','K'],
  ['T-2','Pre-Save-Link & Content-Snippets','N'],
  ['T-0','Release-Tag','TH']
];
/* EP/Album: Fahrplan fürs Gesamtprojekt – die Songs haben ihren eigenen */
const TEMPLATE_PROJECT = [
  ['T-12','Tracklist & Reihenfolge festlegen','A'],
  ['T-12','Singles & Termine der Auskopplungen festlegen','TH'],
  ['T-8','Alle Songs gemischt & gemastert','P'],
  ['T-8','Projekt-Cover fertig','N'],
  ['T-6','Credits & Splits aller Songs vollständig','K'],
  ['T-6','Distributor-Upload, UPC, ISRCs','K'],
  ['T-4','Spotify-Pitch & Promo-Plan','K'],
  ['T-2','Pre-Save-Link & Content','N'],
  ['T-0','Release-Tag (mit letzter Single)','TH']
];
/* Song nur auf der EP/dem Album: Produktion bis fertig, Release läuft über das Projekt */
const TEMPLATE_SONG = [
  ['T-12','Song geschrieben','A'],
  ['T-12','Demo im System','A'],
  ['T-12','Recording bei CloudStudios','A'],
  ['T-8','Mix & Master final','P'],
  ['T-6','Credits & Splits, ISRC','K']
];
const templateFor = r => (r.type === 'EP' || r.type === 'Album') ? TEMPLATE_PROJECT : r.type === 'Song' ? TEMPLATE_SONG : TEMPLATE;
const CONTRACT_ST = ['Unterschrieben','Nicht unterschrieben','Vertrag in Abstimmung'];
const contractOf = p => p?.contractStatus || (p?.role === 'Produzent' ? 'Vertrag in Abstimmung' : 'Unterschrieben');
const COLORS = [
  ['Blau','#2F5BD3','#5C80E0'],['Graphit','#52525B','#71717A'],['Violett','#7A4FBF','#9670D1'],
  ['Orange','#D98A1E','#E7A64B'],['Petrol','#1F7A8C','#4596A6'],['Rot','#C8431E','#DA6B4B'],
  ['Grün','#1E6E50','#3F8D6F'],['Pink','#C2407A','#D46A98']
];
const SP_AUDIO = 'https://cloudsgroup.sharepoint.com/sites/CloudsRecords/Audio/';
const safeUrl = u => /^https:\/\//.test(u || '') ? u : '';
const dropboxFolder = (p, label, cls='small', style='font-weight:700') => safeUrl(p?.dropbox) ? `<a class="${cls}" href="${esc(p.dropbox)}" target="_blank" rel="noopener" style="${style}">${label}</a>` : '';
const COLS = ['people','releases','tasks','tracks','versions','comments','content','studio','beats','sessions','interest','recordings','pplan','pcontent','notes','chat','profile','todos','gigs','gigfin','mwfin','contacts','expenses','asks'];

/* ---------- Zustand ---------- */
const S = {people:{},releases:{},tasks:{},tracks:{},versions:{},comments:{}};
const loaded = new Set();
let db = null, user = null, me = null, dbState = 'wait';
const stack = [{r:'roster'}];
let filterArtist = 'alle';
let pendingRender = false;

/* ---------- Vertragslogik ---------- */
function contractYear(p){
  const s = parse(p.start); if(!s) return null;
  const y = Math.floor((today() - s) / (365.25*864e5)) + 1;
  return Math.max(1, Math.min(y, p.years || y));
}
function yearLabel(p){
  const s = parse(p.start);
  if(!s) return `${p.years} J · START OFFEN`;
  if(s > today()) return `START ${fmt(p.start)}`;
  return `JAHR ${contractYear(p)}/${p.years}`;
}
function yearRange(p, y){
  const s = parse(p.start); if(!s) return '';
  const a = s.getFullYear() + y - 1;
  return ` · ${a}/${String(a+1).slice(2)}`;
}
function counts(p){
  const rs = relsOf(p.id).filter(r => r.pflicht);
  const by = t => rs.filter(r => r.type === t);
  return ['Single','EP','Album'].map(t => ({type:t, need: t==='Single'?p.singles:t==='EP'?p.eps:p.albums, list: by(t)}));
}
function boxesHTML(p){
  return counts(p).map((g,i) => {
    const cls = TYPE[g.type].key;
    let out = '';
    for(let k=0;k<(g.need||0);k++){
      const r = g.list[k];
      const st = !r ? '' : r.status === 'Released' ? ' fill' : isActive(r) ? ' wip' : '';
      out += `<span class="box c-${cls}${st}"></span>`;
    }
    return (i ? '<span class="gap8"></span>' : '') + out;
  }).join('');
}
function countLine(p){
  const pl = (n,a,b) => `${n} ${n===1?a:b}`;
  return `${pl(p.singles||0,'SINGLE','SINGLES')} · ${pl(p.eps||0,'EP','EPS')} · ${pl(p.albums||0,'ALBUM','ALBEN')}`;
}

/* Verteilungs-Vorschlag: Jahr 1 Singles, EPs in den mittleren Jahren, Album im letzten Jahr */
function planReleases(p){
  const Y = Math.max(1, p.years|0), out = [];
  let s = 0;
  const firstSingles = Math.min(p.singles, Y >= 5 ? 2 : 3);
  const middle = []; for(let y=2;y<Y;y++) middle.push(y);
  const mid = middle.length ? middle : [Y];
  const push = (type, code, year, order) => out.push({type, code, year, order});
  for(let i=0;i<firstSingles;i++){ s++; push('Single','S0'+s,1,s); }
  const rest = p.singles - firstSingles;
  const base = Math.floor(rest / mid.length), rem = rest % mid.length;
  mid.forEach((y,i) => { const n = base + (i >= mid.length - rem ? 1 : 0); for(let k=0;k<n;k++){ s++; push('Single','S0'+s,y,10+s); } });
  for(let e=0;e<p.eps;e++){
    const y = p.eps === 1 ? mid[0] : mid[Math.round(e*(mid.length-1)/(p.eps-1))];
    push('EP','EP0'+(e+1),y,5+e);
  }
  for(let a=0;a<p.albums;a++) push('Album', p.albums>1 ? 'LP'+(a+1) : 'LP', Y, 50+a);
  return out;
}
function relDoc(p, x){
  const n = parseInt(x.code.replace(/\D/g,'')) || 1;
  const countsTo = x.type === 'Single' ? `Single ${n}/${p.singles}` : x.type === 'EP' ? `EP ${n}/${p.eps}` : `Album ${p.albums>1?n+'/'+p.albums:'1/1'}`;
  return {artist:p.id, code:x.code, type:x.type, year:x.year, order:x.order, pflicht:true, countsTo, status:'Geplant', date:'', title:''};
}

async function put(col, id, data, merge=true){

  try{

    if(merge && S[col][id]) await ref.update(data); else await ref.set(data);
    return true;
  }catch(e){ toast(e.code === 'not_granted' ? 'Keine Schreibrechte für diese Ansicht' : 'Nicht gespeichert: ' + (e.message||e.code)); return false; }
}
async function del(col, id){

  if(!db) return false;
  try{ await db.collection(col).doc(id).delete(); return true; }catch(e){ toast('Nicht gelöscht: ' + (e.message||e.code)); return false; }
}

/* ---------- Medien (Supabase Storage) ---------- */
const MAX_AUDIO = 50 * 1024 * 1024;
const AUDIO_TYPES = {mp3:'audio/mpeg', m4a:'audio/mp4', aac:'audio/aac', wav:'audio/wav'};
const urlCache = {}, urlPending = {};
async function signedUrl(bucket, path){
  const k = bucket + '/' + path, c = urlCache[k];
  if(c && c.exp > Date.now()) return c.url;
  const {data, error} = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if(error) throw error;
  urlCache[k] = {url: data.signedUrl, exp: Date.now() + 50*60e3};
  return data.signedUrl;
}
/* Cover-URL synchron liefern, falls schon geladen; sonst laden und neu zeichnen */
function coverUrl(r){
  if(!r?.cover || !sb) return null;
  const k = 'covers/' + r.cover, c = urlCache[k];
  if(c && c.exp > Date.now()) return c.url;
  if(!urlPending[k]){ urlPending[k] = signedUrl('covers', r.cover).then(() => render()).catch(() => {}).finally(() => delete urlPending[k]); }
  return null;
}
const coverTag = r => { const u = coverUrl(r); return u ? `<img src="${esc(u)}" alt="" loading="lazy">` : ''; };
async function playVersion(vid){
  const v = S.versions[vid]; if(!v) return;
  if(!v.file){ if(v.link) window.open(v.link, '_blank', 'noopener'); return; }
  const t = S.tracks[v.track], r = t && S.releases[t.release];
  try{
    const url = await signedUrl('audio', v.file);
    const a = $('#miniAudio');
    $('#miniTitle').textContent = (t?.title || 'Track') + ' · ' + v.label;
    $('#miniSub').textContent = ((person(r?.artist)?.name || '') + ' · ' + (v.kind || '')).toUpperCase();
    $('#mini').hidden = false; document.body.classList.add('hasmini');
    if(a.dataset.vid !== vid){ a.src = url; a.dataset.vid = vid; }
    await a.play().catch(() => {});
  }catch(e){ toast('Datei konnte nicht geladen werden'); }
}
async function uploadFile(bucket, path, file, type){
  const {error} = await sb.storage.from(bucket).upload(path, file, {contentType: type, upsert: false, cacheControl: '3600'});
  if(error) throw error;
}
/* Cover vor dem Hochladen auf max. 1400 px verkleinern (spart Speicher, lädt schneller) */
function shrinkImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const m = 1400, sc = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error('Bild')), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src = u;
  });
}

const cur = () => stack[stack.length-1];
let lockedArtist = null; /* gesetzt, wenn ein Artist angemeldet ist: App bleibt in seinem Bereich */
const lockP = (r, p) => { if(!lockedArtist) return [r, p]; const ok = ['artiststart','artist','release','track','tracks','recordings','market','apin','video','profile','cal','search','week','live'].includes(r) ? r : 'artiststart';
  const q = {...p, preview: lockedArtist}; if(ok === 'artiststart' || ok === 'artist' || ok === 'recordings' || ok === 'market' || ok === 'apin' || ok === 'profile') q.id = (ok === r && p.id && S.people[p.id]) ? p.id : lockedArtist; if(ok === 'tracks') q.artist = lockedArtist; return [ok, q]; };
function go(r, p={}){ [r, p] = lockP(r, p); stack.push({r, ...p}); render(); window.scrollTo(0,0); }
function back(){ if(stack.length > 1) stack.pop(); render(); window.scrollTo(0,0); }
function tab(r, p={}){ [r, p] = lockP(r, p); stack.length = 0; stack.push({r, ...p}); render(); window.scrollTo(0,0); }
const isPreview = () => !!cur().preview;
let myProducer = null; /* Produzent bleibt immer in seiner Leiste */

function ctxArtist(c){
  if((c.r === 'artist' || c.r === 'artiststart') && S.people[c.id]?.role === 'Artist') return c.id;
  if(c.r === 'release') return S.releases[c.id]?.artist || null;
  if(c.r === 'track'){ const t = S.tracks[c.id]; return t ? S.releases[t.release]?.artist || null : null; }
  if(c.r === 'tracks' && c.artist) return c.artist;
  if((c.r === 'recordings' || c.r === 'market' || c.r === 'apin' || c.r === 'profile') && S.people[c.id]) return c.id;
  if(c.r === 'video') return isGig(c.id) ? null : (planCtx(c.id).artist || null);
  if(c.r === 'live' && c.a && c.inArtist) return c.a;
  return null;
}

document.addEventListener('focusout', () => setTimeout(() => { if(pendingRender) render(); }, 50));

function banner(){
  if(dbState === 'off') return `<div class="banner"><span>KEINE VERBINDUNG ZUR DATENBANK. BITTE SEITE NEU LADEN.</span></div>`;
  if(['roster','cockpit'].includes(cur().r) && account) return `<div class="acct"><span>ANGEMELDET · ${esc(account.name.toUpperCase())}</span><button data-act="logout">ABMELDEN</button></div>`;
  return '';
}
function previewBanner(){
  if(!isPreview()) return '';
  const p = person(cur().preview);
  if(lockedArtist) return `<div class="acct"><span>ANGEMELDET · ${esc((account?.name||p?.name||'').toUpperCase())}</span><button data-act="logout">ABMELDEN</button></div>`;
  return `<div class="banner"><span>VORSCHAU · SO SIEHT ${esc((p?.name||'').toUpperCase())} DIE APP</span><button class="chip" data-act="exitpreview">BEENDEN</button></div>`;
}

/* Roster */
function vRoster(){
  const arts = artists(), prods = producers();
  const ready = loaded.has('people');
  let cards;
  if(!ready && dbState !== 'off') cards = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  else if(!arts.length) cards = `<div class="empty" style="margin:0"><b style="font-size:20px">Noch keine Artists im Roster</b><span class="small">Lege den ersten Artist über das Plus oben rechts an. Die Pflicht-Releases werden aus dem Vertrag erzeugt.</span><button class="pill sun" data-act="addperson">${icon.plus} Artist anlegen</button></div>`;
  else cards = arts.map(p => {
    const yr = contractYear(p);
    const r = currentRelease(p.id), nx = nextPlanned(p.id);
    const st = r ? `<div class="status" style="color:${TYPE[r.type].c}">● ${esc(relName(r).toUpperCase())} · ${esc(r.status.toUpperCase())}</div>`
             : `<div class="status" style="color:var(--mute)">○ ${nx && nx.date ? 'NÄCHSTES: ' + esc(relName(nx).toUpperCase()) + ' · ' + fmt(nx.date) : 'FAHRPLAN OFFEN'}</div>`;
    const rs = relsOf(p.id).filter(x => x.pflicht), dn = rs.filter(x => x.status === 'Released').length;
    const cv = photoOf(p) || (r ? coverUrl(r) : null);
    return `<button class="tilecard" data-go="artiststart" data-id="${esc(p.id)}" aria-label="${esc(p.name)} öffnen">
      <div class="tc-art" style="background:${esc(p.color)}">${cv ? `<img src="${esc(cv)}" alt="">` : `<span class="tc-ini">${esc((p.name||'?')[0])}</span>`}<span class="tc-yr">${yearLabel(p)}</span>${newFor(p.id) ? `<span class="tc-new">${newFor(p.id)} NEU</span>` : ''}</div>
      <div class="tc-body"><span class="tc-name">${esc(p.name)}</span>${st}
        <div class="tc-bar"><i style="width:${rs.length ? Math.max(4, Math.round(dn/rs.length*100)) : 0}%;background:${esc(p.color)}"></i></div>
        <span class="small">${dn} von ${rs.length} Releases</span></div></button>`;
  }).join('');
  const prodTiles = ready ? prods.map(p => { const all = beatsOf(p.id), neu = all.filter(b => b.status === 'Neu').length, img = photoOf(p);
    return `<button class="tilecard" data-go="pmonth" data-id="${esc(p.id)}" aria-label="${esc(p.name)} öffnen">
      <div class="tc-art" style="background:var(--sun)">${img ? `<img src="${esc(img)}" alt="">` : `<span class="tc-ini" style="color:var(--on-sun)">${esc((p.name||'?')[0])}</span>`}<span class="tc-yr">PRODUZENT</span>${neu ? `<span class="tc-new">${neu} NEU</span>` : ''}</div>
      <div class="tc-body"><span class="tc-name">${esc(p.name)}</span><div class="status" style="color:var(--sun)">● ${all.length} BEATS · ${all.filter(b => b.bsLive || b.ytLive).length} IM STORE</div>
        <div class="tc-bar"><i style="width:${all.length ? Math.max(4, Math.round(all.filter(b => b.status === 'Platziert').length/all.length*100)) : 0}%;background:var(--sun)"></i></div>
        <span class="small">${all.filter(b => b.status === 'Platziert').length} platziert</span></div></button>`; }).join('') : '';
  const prodCards = prods.map(p => `<button class="pcard" data-go="beats" data-id="${esc(p.id)}">
      <div class="avatar" style="background:var(--sun);color:var(--on-sun)">${avIn(p)}</div>
      <div class="stack" style="flex:1;gap:4px"><span style="font-weight:700;font-size:19px">${esc(p.name)}</span><span class="mono" style="font-size:11px;color:var(--soft)">${beatsOf(p.id).length} BEATS · ${beatsOf(p.id).filter(b => b.status === 'Neu').length} NEU · ${openFor('P')} OFFEN</span></div>${icon.chev}</button>`).join('');
  return `${cloudSvg}
    <div class="topbar"><span class="brand"><span><b>CLOUDS<svg class="bolt" width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><path d="M8 0L0 10h5l-2 8 9-11H7l1-7z" fill="#FFCC00"/></svg>RECORDS</b><i>Where Creativity Becomes Reality</i></span></span><span class="row topacts" style="gap:6px"><button class="iconbtn" data-go="search" aria-label="Suchen">${icon.search}</button><button class="iconbtn" data-act="addperson" aria-label="Artist oder Produzent anlegen">${icon.plus}</button></span></div>
    ${banner()}
    <div class="pad row" style="padding-top:18px;align-items:flex-end;gap:12px;position:relative"><h1 class="h-giant">Artists</h1><span class="sticker tilt" style="margin-bottom:10px">NUR TEAM</span></div>
    <div class="pad legend" style="padding-top:16px"><span><i class="sw" style="background:var(--single)"></i>SINGLE</span><span><i class="sw" style="background:var(--ep)"></i>EP</span><span><i class="sw" style="background:var(--album)"></i>ALBUM</span><span><i class="box wip c-single" style="width:10px;height:10px"></i>LÄUFT</span></div>
    <div class="tilegrid">${cards}${prodTiles}</div><div class="list" style="padding-top:4px">
      ${ready ? `<div class="small" style="padding-top:6px">${totalLine()}</div>` : ''}
    </div>`;
}
function totalLine(){
  const rs = vals(S.releases).filter(r => r.pflicht);
  const done = rs.filter(r => r.status === 'Released').length;
  return `${rs.length} PFLICHT-RELEASES IM ROSTER · ${done} VERÖFFENTLICHT`;
}
function openFor(owner){ return vals(S.tasks).filter(t => t.owner === owner && !t.done).length; }

/* Artist · Timeline */
function vArtist(c){
  const p = person(c.id);
  if(!p) throw new Error('missing');
  const rs = relsOf(p.id).filter(r => r.type !== 'Song'), yr = contractYear(p);
  const cs = counts(p);
  const done = t => cs.find(x => x.type===t).list.filter(r => r.status==='Released').length;
  const curR = currentRelease(p.id);
  const years = [...new Set(rs.map(relYear))].sort((a,b)=>a-b);
  const pfl = rs.filter(r => r.pflicht).length, vor = rs.length - pfl;
  const startTxt = p.start ? `VERTRAG ${parse(p.start).getFullYear()}–${parse(p.start).getFullYear()+p.years}` : 'VERTRAGSBEGINN OFFEN';
  const darkText = p.color === '#F2C94C';
  const head = `<div class="ahead ${photoOf(p) ? 'hasphoto' : ''}" style="background:${esc(p.color)};${darkText && !photoOf(p) ?'color:var(--ink)':''}">
      ${photoOf(p) ? `<img class="aheadimg" src="${esc(photoOf(p))}" alt=""><span class="aheadshade"></span>` : `<span class="bigini" aria-hidden="true" style="color:${esc(p.color2)};opacity:1">${esc(p.name[0])}</span>`}
      <div class="between" style="padding-top:12px;position:relative">
        ${isPreview() ? '<span class="brand"><span><b>CLOUDS<svg class="bolt" width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><path d="M8 0L0 10h5l-2 8 9-11H7l1-7z" fill="#FFCC00"/></svg>RECORDS</b><i>Where Creativity Becomes Reality</i></span></span>' : `<button class="back" style="color:inherit" data-act="back">${icon.back}ARTISTS</button>`}
        ${isPreview() ? '' : `<div class="row" style="gap:8px"><button class="chip" data-act="preview" data-id="${esc(p.id)}">ARTIST-SICHT</button><button class="chip" data-act="editperson" data-id="${esc(p.id)}">VERTRAG</button></div>`}
      </div>
      <div class="mono" style="font-size:11px;font-weight:700;letter-spacing:.1em;margin-top:18px;position:relative">ARTIST · ${startTxt} · ${yearLabel(p)}</div>
      ${!isPreview() && contractOf(p) !== 'Unterschrieben' ? `<span class="sticker" style="position:relative;display:inline-block;margin-top:8px;background:var(--danger);color:#fff">⚠ ${esc(contractOf(p).toUpperCase())}</span>` : ''}
      <h1 class="h-giant" style="position:relative;margin-top:6px;font-size:68px">${esc(p.name)}</h1>
      <div class="counters" style="position:relative">
        <div class="counter"><b>${done('Single')}/${p.singles}</b><span>SINGLES</span></div>
        <div class="counter"><b>${done('EP')}/${p.eps}</b><span>EPS</span></div>
        <div class="counter"><b>${done('Album')}/${p.albums}</b><span>${p.albums===1?'ALBUM':'ALBEN'}</span></div>
      </div></div>`;
  /* Veröffentlichte bleiben im Jahr stehen (abgeschlossen ✓) – kein Archiv */
  const body = [...new Set(rs.map(relYear))].sort((a,b) => a-b).map(y => { const ys = rs.filter(r => relYear(r) === y), dn = ys.filter(r => r.status === 'Released').length;
    return `<div class="yearhead"><span class="lbl">JAHR ${y}${yearRange(p,y)}${dn ? ' · ' + dn + ' DRAUSSEN ✓' : ''}</span><i></i></div>
    ${ys.map(r => relRow(r, r === curR)).join('')}`; }).join('');
  return `${head}${banner()}${previewBanner()}
    <div class="pad" style="padding-top:22px">
      <div class="between"><h2 class="h-sec">Projekte</h2><span class="small">${pfl} PFLICHT${vor?` + ${vor} VORAB`:''}</span></div>
      ${rs.length ? body : `<div class="empty" style="margin:16px 0"><b>Noch keine Releases</b><span class="small">Pflicht-Releases aus dem Vertrag erzeugen.</span><button class="pill sun" data-act="genrels" data-id="${esc(p.id)}">Releases erzeugen</button></div>`}
      ${isPreview() ? '' : `<div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="pill dash" data-act="addvorab" data-id="${esc(p.id)}">${icon.plus} Vorab-Single</button>${dropboxFolder(p, `${icon.folder} Dropbox-Ordner`, 'pill dash', '')}</div>`}
    </div>`;
}
function projSummary(r){
  const k = childrenOf(r), sg = k.filter(x => x.type === 'Vorab-Single');
  const fertig = k.filter(x => x.status === 'Released' || ['Master','Distribution','Promo','Released'].includes(x.status)).length;
  return `${k.length} Songs · ${fertig}/${k.length} fertig${sg.length ? ` · Singles ${sg.filter(x => x.status === 'Released').length}/${sg.length} draußen` : ''}`;
}
function songsSection(r, kids){
  const lbl = r.type === 'Album' ? 'Songs des Albums' : 'Songs der EP';
  const rows = kids.map((k, i) => {
    const ts = tasksOf(k.id), dn = ts.filter(t => t.done).length, single = k.type === 'Vorab-Single';
    const sub = `${single ? 'SINGLE' : 'NUR AUF ' + esc(relName(r).toUpperCase())} · ${esc(k.status.toUpperCase())}${ts.length ? ` · ${dn}/${ts.length}` : ' · KEIN FAHRPLAN'}`;
    const when = k.date ? fmt(k.date) : single ? 'DATUM<br>OFFEN' : '';
    return `<button class="rrow ${k.status==='Released'?'done':''}" data-go="release" data-id="${esc(k.id)}">
      <span class="cover" style="background:${TYPE[k.type].c}">${coverUrl(k) ? coverTag(k) : ''}<span style="position:relative">${k.pos || i + 1}</span></span>
      <span class="stack" style="gap:4px;min-width:0"><span class="t">${esc(k.title || '[Titel offen]')}</span><span class="small" style="font-weight:700;color:${single ? TYPE['Vorab-Single'].c : 'var(--mute)'}">${sub}</span></span>
      <span class="small" style="text-align:right">${when}</span></button>`;
  }).join('');
  return `<div class="pad between" style="padding-top:18px"><h2 class="h-sec">${lbl}</h2>${isPreview() ? '' : `<button class="pill" data-act="addsong" data-id="${esc(r.id)}">${icon.plus} Song</button>`}</div>
    <div class="pad" style="padding-top:10px">${kids.length ? `<span class="small" style="display:block;margin-bottom:8px">${esc(projSummary(r).toUpperCase())} · SONG ANTIPPEN = EIGENER RELEASE-PLAN</span>${rows}`
      : `<div class="empty" style="margin:0"><b>Noch keine Songs</b><span class="small">Jeden Song einzeln anlegen – als Single-Auskopplung (eigenes Cover, Datum, Content, Video) oder nur auf ${esc(relName(r))}. Jeder Song bekommt seinen eigenen Fahrplan.</span>${isPreview() ? '' : `<button class="pill sun" data-act="addsong" data-id="${esc(r.id)}">${icon.plus} Ersten Song anlegen</button>`}</div>`}</div>`;
}
function relRow(r, now){
  const T = TYPE[r.type], ts = tasksOf(r.id), dn = ts.filter(t=>t.done).length;
  const statusTxt = r.status === 'Released' ? '✓ DRAUSSEN' + (campsOf(r).some(x => x.status === 'Läuft') ? ' · KAMPAGNE LÄUFT' : '') : r.status.toUpperCase() + (ts.length && isActive(r) ? ` · ${dn}/${ts.length}` : '');
  const par = parentOf(r), kids = isProject(r) ? childrenOf(r) : [];
  const parent = par ? `<span class="small" style="color:${TYPE.EP.c};font-weight:700">${r.pos ? 'SONG ' + r.pos + ' · ' : ''}${esc(relName(par).toUpperCase())}${par.title ? ' · ' + esc(par.title.toUpperCase()) : ''}</span>`
    : kids.length ? `<span class="small" style="color:${TYPE.EP.c};font-weight:700">${projSummary(r).toUpperCase()}</span>` : '';
  return `<button class="rrow ${now?'now':''} ${r.status==='Released'?'done':''}" data-go="release" data-id="${esc(r.id)}">
    <span class="cover" style="background:${T.c}">${coverUrl(r) ? coverTag(r) : miniVinyl}<span style="position:relative">${esc(r.code)}</span></span>
    <span class="stack" style="gap:4px;min-width:0"><span class="t">${esc(relTitle(r))}${now?'<span class="sticker tilt3" style="padding:3px 6px;font-size:10px">JETZT</span>':''}</span>
      <span class="small" style="font-weight:700;color:${r.status === 'Released' ? '#39ff88' : isActive(r)?T.c:'var(--mute)'}">${esc(statusTxt)}${r.coop?.partner ? ' · KOOP ' + esc(r.coop.partner.toUpperCase()) : ''}${r.video ? ' · VIDEO' : ''}</span>${parent}</span>
    <span class="small" style="text-align:right">${r.date ? fmt(r.date) : 'DATUM<br>OFFEN'}</span></button>`;
}

/* Release-Detail */
function vRelease(c){
  const r = S.releases[c.id]; if(!r) throw new Error('missing');
  const p = person(r.artist), T = TYPE[r.type];
  const ts = tasksOf(r.id), dn = ts.filter(t=>t.done).length, curT = ts.find(t=>!t.done);
  const d = daysTo(r.date);
  const countdown = d == null ? '' : d > 0 ? `NOCH ${d} TAGE` : d === 0 ? 'HEUTE' : `SEIT ${-d} TAGEN DRAUSSEN`;
  const prod = producers()[0];
  const par = parentOf(r), proj = isProject(r), kids = proj ? childrenOf(r) : [], songOnly = r.type === 'Song';
  const steps = ts.map((t,i) => {
    const ok = t.done, isCur = t === curT, last = i === ts.length - 1;
    const isRel = t.phase === 'T-0';
    const due = taskDue(t);
    const dueTxt = due ? fmt(due) : '';
    const ownerTxt = (t.owner ? ` · ${t.owner === 'A' ? esc(p.name.toUpperCase()) : esc((OWNERS[t.owner]||t.owner).toUpperCase())}${esc(withHelpers(t).toUpperCase())}` : '') + checkTxt(t);
    const late = !ok && due && daysTo(due) < 0;
    const cl = checksOf(t);
    const chkTxt = cl.length ? `<span style="display:flex;flex-direction:column;gap:2px;width:100%;margin-top:4px">${cl.map(c => `<span class="small" style="text-transform:none;letter-spacing:0;font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:400;${c.d ? 'text-decoration:line-through;color:var(--mute)' : 'color:var(--ink2)'}">${c.d ? '☑' : '☐'} ${esc(c.t)}${chkOwners(c).length ? ` <span style="color:var(--sun)">→ ${esc(chkNames(c, p.name))}</span>` : ''}${safeUrl(c.l) ? ' <span style="color:var(--sun)">🔗</span>' : ''}</span>`).join('')}</span>` : '';
    const nChat = chatOf('tasks:' + t.id).length;
    const noteTxt = (t.note ? `<span class="small" style="display:inline-block;width:100%;margin-top:4px;color:var(--sun);text-transform:none;letter-spacing:0;white-space:pre-line;font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:400;text-decoration:none">✎ ${esc(t.note.length > 90 ? t.note.slice(0,90) + ' …' : t.note)}</span>` : '') + chkTxt + (nChat ? `<span class="small" style="display:inline-block;width:100%;margin-top:4px;color:var(--sun);text-transform:none;letter-spacing:0;font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:600">💬 ${nChat} ${nChat === 1 ? 'Nachricht' : 'Nachrichten'}</span>` : '');
    return `<div class="step">
      <span class="ph" style="${isCur?`color:${T.c}`:''}">${esc(t.phase)}</span>
      <span class="rail">${isRel ? `<button class="dot ${ok?'ok':''}" data-act="toggle" data-id="${esc(t.id)}" aria-label="${esc(t.title)} ${ok?'zurücksetzen':'abhaken'}" style="border-radius:4px;transform:rotate(45deg);${ok?'':`background:${T.c}`}">${ok?'<span style="transform:rotate(-45deg);display:flex">'+icon.check+'</span>':''}</button>`
        : `<button class="dot ${ok?'ok':isCur?'cur':''}" data-act="toggle" data-id="${esc(t.id)}" aria-label="${esc(t.title)} ${ok?'zurücksetzen':'abhaken'}">${ok?icon.check:''}</button>`}
        ${last?'':`<span class="line ${ok?'solid':''}" style="${isCur?'height:56px':''}"></span>`}</span>
      <button class="stxt ${ok?'ok':isCur?'cur':''}" data-act="edittask" data-id="${esc(t.id)}" style="${isRel&&!ok?'font-weight:700;font-size:18px':''}">
        ${isCur ? `<span style="font-weight:700;font-size:16px">${esc(t.title)}</span><span class="small">${esc(OWNERS[t.owner]||'').toUpperCase()}${esc(withHelpers(t).toUpperCase())}${checkTxt(t)}${dueTxt?' · FÄLLIG '+dueTxt:''}${late?' · <b style="color:var(--danger)">ÜBERFÄLLIG</b>':''}</span>${noteTxt}`
                : `${esc(t.title)} <span class="small">${ownerTxt}${dueTxt&&!ok?' · '+dueTxt:''}</span>${late?' <span class="small" style="color:var(--danger);font-weight:700">ÜBERFÄLLIG</span>':''}${noteTxt}`}
      </button></div>`;
  }).join('');
  const trs = tracksOf(r.id);
  const trackList = trs.map(t => {
    const v = versionsOf(t.id)[0];
    return `<button class="vrow top" data-go="track" data-id="${esc(t.id)}" style="width:100%;text-align:left;cursor:pointer;font:inherit">
      <span class="play" style="background:${T.c};color:#fff">${icon.play}</span>
      <span class="stack" style="flex:1;gap:2px;min-width:0"><span style="font-weight:700;font-size:16px">${esc(t.title)}</span><span class="small">${esc((t.stage||'').toUpperCase())}${v?' · '+esc(v.label.toUpperCase()):' · NOCH KEINE VERSION'}</span></span>${icon.chev}</button>`;
  }).join('');
  return `${banner()}${previewBanner()}
    <div class="between" style="padding:12px 16px 0"><button class="back" data-act="back">${icon.back}${esc(p.name)}</button>${par ? `<button class="chip" data-go="release" data-id="${esc(par.id)}">TEIL VON ${esc(relName(par).toUpperCase())}${par.title ? ' · ' + esc(par.title.toUpperCase()) : ''} →</button>` : `<span class="small">${r.pflicht ? 'ZÄHLT ALS ' + esc((r.countsTo||'').toUpperCase()) : 'VORAB · ZÄHLT ZU ' + esc((r.countsTo||'').toUpperCase())}</span>`}</div>
    <div class="rhero" style="background:${T.c}">${coverUrl(r) ? `<img class="rimg" src="${esc(coverUrl(r))}" alt=""><div class="rshade"></div>` : `
      <svg class="vinyl" width="320" height="320" viewBox="0 0 320 320" aria-hidden="true"><circle cx="160" cy="160" r="158" fill="#141414"/><circle cx="160" cy="160" r="130" fill="none" stroke="#2A2A2A" stroke-width="2"/><circle cx="160" cy="160" r="110" fill="none" stroke="#2A2A2A" stroke-width="2"/><circle cx="160" cy="160" r="90" fill="none" stroke="#2A2A2A" stroke-width="2"/><circle cx="160" cy="160" r="52" fill="#F2C94C"/><circle cx="160" cy="160" r="6" fill="#F3EFE6"/><text x="160" y="166" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#141414" dy="-14">${esc(r.code)}</text></svg>`}
      <div class="between" style="position:absolute;left:20px;right:16px;top:14px"><span class="mono" style="font-size:12px;font-weight:700;letter-spacing:.12em">${esc(relName(r).toUpperCase())}</span>
        ${isPreview()?'':`<button class="iconbtn" style="width:40px;height:40px;background:rgba(20,20,20,.35);border-color:transparent;position:relative" data-act="editrel" data-id="${esc(r.id)}" aria-label="Release bearbeiten">${icon.edit}</button>`}</div>
      <div style="position:absolute;left:20px;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px">
        <div style="font-weight:700;font-size:36px;line-height:1.02;position:relative;letter-spacing:-.03em;text-wrap:balance">${esc(r.title || '[Titel offen]')}</div>
        <div class="row" style="flex-wrap:wrap;gap:8px">
          <span class="chip">${r.date ? 'RELEASE ' + fmt(r.date) : songOnly && relDate(r) ? 'MIT ' + esc(relName(par).toUpperCase()) + ' · ' + fmt(relDate(r)) : 'RELEASE-DATUM OFFEN'}</span>
          <span class="chip" style="background:var(--raise);color:var(--ink)">${esc(r.status.toUpperCase())}</span>
          ${countdown ? `<span class="sticker tilt3">${countdown}</span>` : ''}
          ${r.coop?.partner ? `<span class="chip" style="background:rgba(20,20,20,.45);color:#fff">KOOP · ${esc(r.coop.partner.toUpperCase())}</span>` : ''}
        </div></div></div>
    <div class="pad between" style="padding-top:16px">
      <div class="team">

function sheetStudioLink(id){
  const x = S.studio?.[id]; if(!x) return;
  const pid = x.artist, rels = relsOf(pid).filter(r => r.status !== 'Released');
  const parents = rels.filter(r => r.type === 'EP' || r.type === 'Album');
  const same = vals(S.studio||{}).filter(s => s.artist === pid && !s.release && s.id !== id && x.song && (s.song||'').trim().toLowerCase() === x.song.trim().toLowerCase());
  const opts = [...rels.map(r => [r.id, relName(r) + (r.title ? ' · ' + r.title : ' · Titel offen')]), ...parents.map(r => ['new:' + r.id, '+ Neuer Song auf ' + relName(r) + (r.title ? ' · ' + r.title : '')])];
  if(!opts.length) return toast('Für ' + (person(pid)?.name || 'den Artist') + ' ist noch kein Release angelegt');
  const fields = `${Sel('target','ZU WELCHEM RELEASE?',opts,opts[0][0])}
    ${F('title','SONGTITEL',x.song||'','text','placeholder="Titel offen"')}
    <p class="small" style="margin:-4px 0 12px">Hat das Release noch keinen Titel, übernimmt es diesen.${same.length ? ' ' + same.length + ' weitere freie Session(s) mit demselben Arbeitstitel werden mit zugeordnet.' : ''}</p>`;
  sheet('Session einem Release zuordnen', fields, async fd => {
    const title = (fd.title||'').trim();
    let rid = fd.target;
    if(rid.startsWith('new:')){
      const par = S.releases[rid.slice(4)]; if(!par) return false;
      const kids = childrenOf(par), n = vals(S.releases).filter(r => r.artist === pid && r.type === 'Song').length + 1;
      const code = par.code + '-' + String(n).padStart(2,'0');
      rid = `${pid}-${code}`; if(S.releases[rid]) rid = uid(pid + '-' + code);
      const doc = {artist:pid, code, type:'Song', year:relYear(par), order:par.order + 0.01 * n, pflicht:false, countsTo:relName(par), parent:par.id, pos:kids.length + 1, status:'Recording', date:'', title};
      if(!await put('releases', rid, doc, false)) return false;
      S.releases[rid] = {id:rid, ...doc};
      await applyTemplate(rid);
      if(title) await put('tracks', uid('tr'), {release:rid, title, producer: producers()[0]?.name || '', stage:'Recording'}, false);
    } else {
      const r = S.releases[rid]; if(!r) return false;
      if(title && !r.title){ await put('releases', rid, {title}); if(!tracksOf(rid).length) await put('tracks', uid('tr'), {release:rid, title, producer: producers()[0]?.name || '', stage:'Recording'}, false); }
    }
    for(const s of [x, ...same]) await put('studio', s.id, {release:rid, song:''});
    toast('Zugeordnet · ' + relName(S.releases[rid]) + (title ? ' · ' + title : ''));
  });
}

/* Track */
function wave(seed, color){
  let h = 0; for(const ch of seed) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  let x = '';
  for(let i=0;i<50;i++){ h = (h*1103515245 + 12345) >>> 0; const v = 6 + (h % 46); x += `<rect x="${i*7}" y="${(56-v)/2}" width="4" height="${v}" rx="2" fill="${i<22?color:'#4A4740'}"/>`; }
  return `<svg width="100%" height="56" viewBox="0 0 350 56" preserveAspectRatio="none" aria-hidden="true">${x}<rect x="152" y="0" width="3" height="56" fill="#F2C94C"/></svg>`;
}

}

/* Alle Tracks */
const musicSwitch = (aid, on) => aid ? `<div class="chips" style="padding-top:14px"><button class="pill ${on === 'tracks' ? 'on' : ''}" data-act="musictab" data-id="tracks|${esc(aid)}">🎵 Tracks · ${vals(S.tracks).filter(t => S.releases[t.release]?.artist === aid).length}</button><button class="pill ${on === 'rec' ? 'on' : ''}" data-act="musictab" data-id="rec|${esc(aid)}">🎙 Recordings · ${recsOf(aid).filter(x => x.status !== 'Übernommen').length}</button></div>` : '';
function vTracks(c){
  const only = c.artist;
  const list = vals(S.tracks).filter(t => !only || S.releases[t.release]?.artist === only);
  const groups = {};
  list.forEach(t => { const r = S.releases[t.release]; if(!r) return; (groups[r.artist] ||= []).push(t); });
  const order = artists().filter(a => groups[a.id]);
  return `${cloudSvg}<div class="topbar"><span class="brand"><span><b>CLOUDS<svg class="bolt" width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><path d="M8 0L0 10h5l-2 8 9-11H7l1-7z" fill="#FFCC00"/></svg>RECORDS</b><i>Where Creativity Becomes Reality</i></span></span><span class="small">${list.length} TRACKS</span></div>${banner()}${previewBanner()}
    <div class="pad" style="padding-top:18px;position:relative"><h1 class="h-giant">${only ? 'Musik' : 'Tracks'}</h1></div>${musicSwitch(only, 'tracks')}
    <div class="list">${order.length ? order.map(a => `<div class="lbl" style="color:${esc(a.color)}">${esc(a.name.toUpperCase())}</div>` +
      groups[a.id].map(t => { const r = S.releases[t.release], v = versionsOf(t.id)[0];
        return `<button class="vrow" data-go="track" data-id="${esc(t.id)}" style="cursor:pointer;width:100%;text-align:left;font:inherit"><span class="play" style="background:${TYPE[r.type].c};color:#fff;font-family:var(--mono);font-size:11px;font-weight:700">${esc(r.code)}</span>
          <span class="stack" style="flex:1;gap:2px;min-width:0"><span style="font-weight:700;font-size:16px">${esc(t.title)}</span><span class="small">${esc(relName(r).toUpperCase())} · ${esc((t.stage||'').toUpperCase())}${v?' · '+esc(v.label.toUpperCase()):''}</span></span>${icon.chev}</button>`; }).join('')).join('')
      : `<div class="empty" style="margin:0"><b>Noch keine Tracks</b><span class="small">Tracks legst du im jeweiligen Release unter „Tracks & Audio“ an.</span></div>`}</div>`;
}

/* Cockpit */
function vCockpit(){
  const open = vals(S.tasks).filter(t => !t.done);
  const overdue = open.filter(t => { const d = taskDue(t); return d && daysTo(d) < 0; });
  const todoOver = vals(S.todos||{}).filter(x => !isTermin(x) && !x.done && x.due && daysTo(x.due) < 0);
  const studio = open.filter(t => /recording/i.test(t.title));
  const radar = vals(S.releases).filter(r => r.date && daysTo(r.date) >= 0 && daysTo(r.date) <= 90).sort((a,b) => a.date.localeCompare(b.date));
  const months = [0,1,2].map(i => { const d = today(); d.setDate(1); d.setMonth(d.getMonth()+i); return d; });
  const radarHTML = months.map(m => {
    const items = radar.filter(r => { const d = parse(r.date); return d.getMonth() === m.getMonth() && d.getFullYear() === m.getFullYear(); });
    return `<div class="stack" style="gap:8px;min-width:0"><span class="lbl" style="color:var(--ink)">${m.toLocaleDateString('de-DE',{month:'short'}).toUpperCase().replace('.','')}</span>
      ${items.map(r => `<button class="rrow" data-go="release" data-id="${esc(r.id)}" style="grid-template-columns:1fr;padding:8px;margin:0;gap:4px"><span class="cover" style="width:100%;height:44px;background:${TYPE[r.type].c}"><span style="position:relative">${esc(r.code)}</span></span><span style="font-weight:700;font-size:14px">${esc(person(r.artist)?.name||'')}</span><span class="small">${fmt(r.date)}</span></button>`).join('') || '<span class="small">—</span>'}</div>`;
  }).join('');
  const contracts = artists().map(p => {
    const rs = relsOf(p.id).filter(r => r.pflicht), dn = rs.filter(r => r.status==='Released').length, act = rs.filter(isActive).length;
    const pct = rs.length ? Math.round(dn / rs.length * 100) : 0, pa = rs.length ? Math.round(act / rs.length * 100) : 0;
    const yr = contractYear(p);
    return `<button class="vrow" data-go="artist" data-id="${esc(p.id)}" style="cursor:pointer;width:100%;text-align:left;font:inherit;flex-wrap:wrap">
      <span class="avatar" style="width:40px;height:40px;font-size:17px;background:${esc(p.color)};color:#fff">${avIn(p)}</span>
      <span class="stack" style="flex:1;gap:6px;min-width:0"><span class="between"><b>${esc(p.name)}</b><span class="small">${yearLabel(p)} · ${dn}/${rs.length}</span></span>
        <span class="bar" aria-label="${dn} von ${rs.length} veröffentlicht"><i style="width:${Math.max(pct,0)}%;background:${esc(p.color)};float:left"></i><i style="width:${pa}%;background:repeating-linear-gradient(45deg,${esc(p.color)} 0 2px,transparent 2px 5px);float:left"></i></span></span></button>`;
  }).join('');
  const missing = artists().filter(p => !p.start);
  const studioReq = studioOf().filter(x => x.status === 'Angefragt');
  const studioNext = studioOf().filter(x => x.status === 'Bestätigt' && x.date >= todayIso()).slice(0,4);
  const overdueTodo = todoOver.map(x => `<button class="vrow" data-act="todoview" data-id="${esc(x.id)}" style="cursor:pointer;width:100%;text-align:left;font:inherit"><span class="play" style="background:var(--danger);color:#fff">☐</span><span class="stack" style="flex:1;gap:2px;min-width:0"><b>${esc(x.title)}</b><span class="small">AUFGABE · ${esc(todoWho(x).toUpperCase())} · FÄLLIG ${fmt(x.due)}</span></span></button>`).join('');
  const overdueList = overdueTodo + overdue.slice(0,6).map(t => { const r = S.releases[t.release]; return r ? `<button class="vrow" data-go="release" data-id="${esc(r.id)}" style="cursor:pointer;width:100%;text-align:left;font:inherit"><span class="play" style="background:var(--danger);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700">${esc(t.phase)}</span><span class="stack" style="flex:1;gap:2px;min-width:0"><b>${esc(t.title)}</b><span class="small">${esc(person(r.artist)?.name.toUpperCase()||'')} · ${esc(relName(r).toUpperCase())} · FÄLLIG ${fmt(taskDue(t))}</span></span></button>` : ''; }).join('');
  return `${cloudSvg}<div class="topbar"><span class="brand"><span><b>CLOUDS<svg class="bolt" width="12" height="18" viewBox="0 0 12 18" aria-hidden="true"><path d="M8 0L0 10h5l-2 8 9-11H7l1-7z" fill="#FFCC00"/></svg>RECORDS</b><i>Where Creativity Becomes Reality</i></span></span><span class="sticker tilt">NUR TEAM</span></div>${banner()}
    <div class="pad" style="padding-top:18px;position:relative"><h1 class="h-giant">Label</h1></div>
    <div class="chips" style="gap:14px;padding-top:16px" aria-label="Artists">${artists().map(p => `<button data-go="artiststart" data-id="${esc(p.id)}" style="background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;color:var(--ink)"><span class="avatar" style="width:56px;height:56px;background:${esc(p.color)};color:#fff">${avIn(p)}</span><span style="font-size:12px;color:var(--ink2)">${esc(p.name)}</span></button>`).join('')}</div>
    <div class="tiles">
      <div class="tile ${overdue.length + todoOver.length?'hot':''}"><b>${overdue.length + todoOver.length}</b><span class="lbl" style="color:var(--ink)">ÜBERFÄLLIG</span></div>
      <div class="tile ${studioReq.length?'hot':'dark'}"><b>${studioReq.length}</b><span class="lbl" style="color:var(--ink)">STUDIO-ANFRAGEN</span></div>
      <div class="tile"><b>${radar.length}</b><span class="lbl" style="color:var(--ink)">RELEASES · 90 TAGE</span></div>
      <div class="tile"><b>${open.length}</b><span class="lbl" style="color:var(--ink)">OFFENE SCHRITTE</span></div>
    </div>
    ${studioReq.length || studioNext.length ? `<div class="pad between" style="padding-top:22px"><h2 class="h-sec">Studio</h2><span class="small">${studioReq.length} OFFEN</span></div><div class="pad stack" style="gap:8px;padding-top:10px">${[...studioReq, ...studioNext].map(x => studioRow(x, true)).join('')}</div>` : ''}
    ${overdueList ? `<div class="pad" style="padding-top:22px"><h2 class="h-sec">Überfällig</h2></div><div class="pad stack" style="gap:8px;padding-top:10px">${overdueList}</div>` : ''}
    <div class="pad between" style="padding-top:24px"><h2 class="h-sec">Release-Radar</h2><span class="small">NÄCHSTE 90 TAGE</span></div>
    <div class="pad" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:12px">${radarHTML}</div>
    ${radar.length ? '' : '<div class="pad small" style="padding-top:8px">Noch kein Release mit Datum in den nächsten 90 Tagen. Datum im Release über den Stift setzen.</div>'}
    <div class="pad between" style="padding-top:24px"><h2 class="h-sec">Verträge</h2><span class="small">VERÖFFENTLICHT / LÄUFT</span></div>
    <div class="pad stack" style="gap:8px;padding-top:12px">${contracts}</div>
    ${missing.length ? `<div class="empty"><b>Vertragsbeginn fehlt</b><span class="small">${esc(missing.map(m=>m.name).join(', '))}. Ohne Beginn rechnet die Timeline keine Vertragsjahre.</span></div>` : ''}
    ${campaignOverview()}
    ${asksTeamSection()}
    ${reqSection()}
    ${expensesOverview()}
    ${contactsOverview()}`;
}

/* Produzent */
function vProducer(c){
  const p = person(c.id); if(!p) throw new Error('missing');
  let list = vals(S.tasks).filter(t => t.owner === 'P' && !t.done);
  const arts = [...new Set(list.map(t => S.releases[t.release]?.artist).filter(Boolean))];
  if(filterArtist !== 'alle') list = list.filter(t => S.releases[t.release]?.artist === filterArtist);
  list.sort((a,b) => (taskDue(a)||'9999').localeCompare(taskDue(b)||'9999'));
  const week = list.filter(t => { const d = taskDue(t); return d && daysTo(d) <= 7; }).length;
  const trackCount = vals(S.tracks).filter(t => (t.producer||'').toLowerCase() === p.name.toLowerCase()).length;
  const cards = list.map((t,i) => {
    const r = S.releases[t.release], a = person(r?.artist); if(!r||!a) return '';
    const due = taskDue(t), d = daysTo(due);
    const when = due ? (d < 0 ? `${-d} TAGE ÜBER` : d === 0 ? 'HEUTE' : `IN ${d} TAGEN`) : 'OHNE DATUM';
    if(i === 0) return `<div style="background:var(--raise);color:var(--ink);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px">
      <div class="between"><span class="sticker tilt3">${when}</span><span class="cover" style="width:44px;height:44px;background:${TYPE[r.type].c};padding:4px">${coverTag(r)}<span style="position:relative">${esc(r.code)}</span></span></div>
      <div class="stack" style="gap:4px"><span class="mono" style="font-size:11px;color:var(--soft)">${esc(a.name.toUpperCase())} · ${esc(relName(r).toUpperCase())}</span><span style="font-weight:700;font-size:26px;line-height:1.05">${esc(t.title)}</span></div>
      <div class="row" style="flex-wrap:wrap">${tracksOf(r.id)[0] ? `<button class="pill sun" data-go="track" data-id="${esc(tracksOf(r.id)[0].id)}">${icon.up} Version hochladen</button>` : `<button class="pill sun" data-go="release" data-id="${esc(r.id)}">${icon.up} Zum Release</button>`}<button class="pill" style="background:transparent;color:var(--paper);border-color:var(--paper)" data-act="toggle" data-id="${esc(t.id)}">${icon.check} Erledigt</button></div></div>`;
    return `<div class="vrow"><span class="play" style="background:${TYPE[r.type].c};color:#fff;font-family:var(--mono);font-size:11px;font-weight:700">${esc(r.code)}</span>
      <button class="stack" data-go="release" data-id="${esc(r.id)}" style="flex:1;gap:2px;min-width:0;background:none;border:0;text-align:left;cursor:pointer;padding:0"><b>${esc(t.title)}</b><span class="small">${esc(a.name.toUpperCase())} · ${when}</span></button>
      <button class="dot" data-act="toggle" data-id="${esc(t.id)}" aria-label="${esc(t.title)} abhaken"></button></div>`;
  }).join('');
  return `${cloudSvg}
    ${prodTop(p)}
    <div class="pad" style="padding-top:10px;position:relative"><span class="lbl">PRODUZENT · ${esc(p.name.toUpperCase())}</span><h1 class="h-big" style="margin-top:6px">Lieferungen</h1></div>
    <div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="tile"><b style="font-size:34px">${list.length}</b><span class="lbl" style="color:var(--ink)">OFFEN</span></div>
      <div class="tile ${week?'hot':''}"><b style="font-size:34px">${week}</b><span class="lbl" style="color:var(--ink)">7 TAGE</span></div>
      <div class="tile"><b style="font-size:34px">${trackCount}</b><span class="lbl" style="color:var(--ink)">TRACKS</span></div></div>
    <div class="chips"><button class="pill ${filterArtist==='alle'?'on':''}" data-act="filter" data-id="alle">Alle</button>${arts.map(id => `<button class="pill ${filterArtist===id?'on':''}" data-act="filter" data-id="${esc(id)}">${esc(person(id)?.name||'')}</button>`).join('')}</div>
    <div class="pad stack" style="gap:10px;padding-top:12px">${cards || `<div class="empty" style="margin:0"><b>Nichts offen</b><span class="small">Alle Schritte mit Zuständigkeit „Produzent“ sind erledigt.</span></div>`}</div>`;
}
